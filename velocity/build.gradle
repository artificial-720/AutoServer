plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.0.0-beta4'
}

dependencies {
    implementation project(":common")
    compileOnly "com.velocitypowered:velocity-api:${project.velocity_version}"
//    annotationProcessor "com.velocitypowered:velocity-api:3.3.0-SNAPSHOT"
    testImplementation "com.velocitypowered:velocity-api:${project.velocity_version}"
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testImplementation "org.mockito:mockito-core:5.18.0"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

processResources {
    inputs.property "version", project.version

    filesMatching("velocity-plugin.json") {
        expand "version": project.version
    }
}

shadowJar {
    archiveFileName.set("${rootProject.name}-${project.name}-${version}.jar")
}
